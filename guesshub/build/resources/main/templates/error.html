<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GuessHub — Página no encontrada</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>
    .error-container {
      max-width: 540px;
      margin: 3.5rem auto;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .error-emoji {
      font-size: 4rem;
      margin-bottom: 0.75rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .error-code {
      display: inline-block;
      background: #FFF8E1;
      color: #B78103;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1rem;
      border: 1px solid #FFE082;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }
    .error-desc {
      color: var(--text-mid);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<th:block th:replace="~{fragments/layout :: shell('inicio')}"></th:block>

<div class="app-layout">
  <main id="main" class="main-column" style="margin-top:1rem">
    
    <div class="error-container">
      <div class="error-emoji">🤔</div>
      
      <div class="error-code" th:text="${status != null ? 'Error ' + status : 'Página no encontrada'}">
        Error 404
      </div>

      <h1 class="error-title">¡Ups! Esta página no existe</h1>
      
      <p class="error-desc">
        Parece que la dirección que buscás no existe o fue movida.
        No te preocupes, ¡los desafíos y trivias te están esperando!
      </p>

      <div class="error-actions">
        <a th:href="@{/}" class="btn btn-green">
          🏠 Volver al Inicio
        </a>
        <a th:href="@{/game}" class="btn btn-secondary">
          🎮 Ir a Jugar
        </a>
      </div>
    </div>

  </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
