<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessHub — Ranking</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <style>
    .cat-tabs {
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      padding-bottom: .25rem;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab-btn {
      padding: .4rem .85rem;
      border-radius: var(--radius-pill);
      font-size: .82rem;
      font-weight: 800;
      white-space: nowrap;
      background: var(--white);
      color: var(--text-mid);
      border: 1.5px solid var(--border);
      transition: all var(--t);
    }
    .cat-tab-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      box-shadow: 0 2px 8px rgba(76, 175, 80, .3);
    }
    .my-pos-card {
      background: linear-gradient(135deg, var(--green-bg) 0%, #F1F8E9 100%);
      border: 1.5px solid var(--green-light);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<div class="phone-frame">

  <nav class="navbar">
    <div class="nav-logo">
      <span>🏆</span>
      Guess<span class="logo-green">Hub</span>
    </div>
    <div class="nav-right">
      <button class="avatar-btn" onclick="location.href='/perfil'">👤</button>
    </div>
  </nav>

  <div class="screen">
    <div class="page-inner">

      <div class="section-title"><span>🏆</span> Ranking</div>

      <!-- Selector de categorías -->
      <div class="cat-tabs" id="ranking-tabs">
        <button class="cat-tab-btn active" data-cat="global">🌐 Global</button>
        <button class="cat-tab-btn" data-cat="peliculas">🎬 Películas</button>
        <button class="cat-tab-btn" data-cat="musica">🎵 Música</button>
        <button class="cat-tab-btn" data-cat="deportes">⚽ Deportes</button>
      </div>

      <!-- Mi Posición Card (si está autenticado) -->
      <div id="my-position-container"></div>

      <!-- Lista del Top 10 -->
      <div class="card" id="ranking-card">
        <div style="font-weight:900;font-size:.95rem;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;">
          <span id="ranking-category-title">Top 10 Global</span>
          <span style="font-size:.75rem;color:var(--text-light);font-weight:700">Actualizado en vivo</span>
        </div>
        <div id="ranking-list" style="display:flex;flex-direction:column;gap:.3rem">
          <div style="text-align:center;color:var(--text-light);padding:2rem">Cargando...</div>
        </div>
      </div>

      <div style="height:.5rem"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="bn-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 20h2V8H7v12zm2-18H7v2h2V2zm4 18h2V4h-2v16zm6 0h2v-8h-2v8zm0-10h2V8h-2v2z"/></svg>
      Ranking
    </button>
    <button class="bn-item" onclick="location.href='/game#login'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Jugar
    </button>
    <button class="bn-item" onclick="location.href='/perfil'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      Perfil
    </button>
  </nav>

</div>

<script>
  const myDisplayName = localStorage.getItem('displayName') || '';
  const token = localStorage.getItem('token');
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const circleCls = { 1: 'c1', 2: 'c2', 3: 'c3' };

  let currentCategory = 'global';

  const catTitles = {
    global: 'Top 10 Global',
    peliculas: 'Top 10 Películas 🎬',
    musica: 'Top 10 Música 🎵',
    deportes: 'Top 10 Deportes ⚽'
  };

  // ── Setup pestañas ──────────────────────────────────────────
  document.querySelectorAll('#ranking-tabs .cat-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#ranking-tabs .cat-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      document.getElementById('ranking-category-title').textContent = catTitles[currentCategory] || 'Top 10';
      cargarRanking(currentCategory);
    });
  });

  // ── Cargar mi posición ──────────────────────────────────────
  async function cargarMiPosicion() {
    const container = document.getElementById('my-position-container');
    if (!token) {
      container.innerHTML = `
        <div style="background:var(--white);border:1.5px dashed var(--border);border-radius:var(--radius);padding:.85rem;text-align:center;">
          <div style="font-size:.85rem;font-weight:700;color:var(--text-mid);margin-bottom:.35rem">
            ¿Querés aparecer en el ranking?
          </div>
          <button onclick="location.href='/game#login'" style="font-size:.8rem;color:var(--green);font-weight:800;background:none;border:none;cursor:pointer">
            Iniciá sesión o registrate →
          </button>
        </div>
      `;
      return;
    }

    try {
      const res = await fetch('/api/ranking/mi-posicion', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) return;
      const data = await res.json();

      if (data.partidasJugadas > 0) {
        container.innerHTML = `
          <div class="my-pos-card anim-pop">
            <div style="display:flex;align-items:center;gap:.75rem">
              <div class="lb-num-circle c1" style="width:42px;height:42px;font-size:1.05rem;font-weight:900">
                #${data.posicion}
              </div>
              <div>
                <div style="font-weight:900;font-size:.95rem">${myDisplayName || 'Mi cuenta'}</div>
                <div style="font-size:.75rem;color:var(--text-light);display:flex;gap:.4rem;align-items:center;margin-top:.15rem">
                  <span>${data.partidasJugadas} jugadas</span>
                  ${data.rachaDias > 0 ? `<span>• 🔥 ${data.rachaDias}d racha</span>` : ''}
                </div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:900;font-size:1.1rem;color:var(--green)">
                ${Number(data.puntos).toLocaleString()}
              </div>
              <div style="font-size:.7rem;color:var(--text-light);font-weight:700">puntos totales</div>
            </div>
          </div>
        `;
      }
    } catch (e) {
      console.warn('No se pudo cargar la posición personal', e);
    }
  }

  // ── Cargar Ranking por Categoría ────────────────────────────
  async function cargarRanking(cat = 'global') {
    const container = document.getElementById('ranking-list');
    container.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:2rem">Cargando...</div>`;

    try {
      const res = await fetch(`/api/ranking?cat=${cat}`);
      if (!res.ok) { showToast('Error al cargar el ranking', 'error'); return; }
      const data = await res.json();

      if (data.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:2rem">
          Todavía no hay jugadores en esta categoría.<br>¡Sé el primero en sumar puntos!
        </div>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(p => {
        const esYo = p.username === myDisplayName;
        const pos = p.posicion;
        const icon = medals[pos] || pos;
        const cls = circleCls[pos] || 'cn';

        const row = document.createElement('div');
        row.className = 'lb-row' + (pos <= 3 ? ' top3' : '');
        row.style.marginBottom = '.3rem';
        if (esYo) row.style.background = 'rgba(76,175,80,.15)';

        row.innerHTML = `
          <div class="lb-num-circle ${cls}">${icon}</div>
          <div class="lb-name" style="display:flex;flex-direction:column;gap:.1rem">
            <span style="${esYo ? 'color:var(--green);font-weight:900' : 'font-weight:800'}">
              ${p.username}${esYo ? ' (vos)' : ''}
            </span>
            ${p.rachaDias > 0 ? `<span style="font-size:.72rem;color:var(--yellow);font-weight:700">🔥 ${p.rachaDias} días</span>` : ''}
          </div>
          <div style="text-align:right">
            <div class="lb-score">${Number(p.puntos).toLocaleString()} pts</div>
            <div style="font-size:.72rem;color:var(--text-light)">${p.partidasJugadas} partidas</div>
          </div>
        `;
        container.appendChild(row);
      });

    } catch (e) {
      showToast('Error de conexión', 'error');
    }
  }

  function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 260); }, 2600);
  }

  cargarMiPosicion();
  cargarRanking('global');
</script>

</body>
</html>
