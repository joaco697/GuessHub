<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F19">
  <title>GuessHub — Rankings Diarios y Globales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{fragments/layout :: shell('ranking')}"></th:block>

<div class="app-layout">

  <!-- Banner Lateral Izquierdo (Desktop) -->
  <aside class="side-ad-column" aria-label="Espacio publicitario">
    <div class="ad-banner-box">
      <span class="ad-icon">🏆</span>
      <strong>Rankings</strong>
      <span>Compite y sube</span>
    </div>
  </aside>

  <!-- Columna Central -->
  <main id="main" class="main-column" style="margin-top:1rem">

    <div style="margin-bottom:1.25rem">
      <h1 style="font-size:1.8rem;margin-bottom:0.25rem">Tabla de Posiciones</h1>
      <p style="color:var(--text-muted);font-size:0.9rem">
        Los mejores jugadores de GuessHub. En caso de empate se comparte puesto con salto numérico.
      </p>
    </div>

    <!-- Pestañas de Período (Hoy vs General) -->
    <div class="ranking-tabs">
      <button class="tab-btn active" id="tab-periodo-diario" type="button" data-periodo="diario">🔥 Top de Hoy</button>
      <button class="tab-btn" id="tab-periodo-general" type="button" data-periodo="general">🌍 Histórico General</button>
    </div>

    <!-- Filtros de Categoría -->
    <div style="display:flex;gap:0.4rem;overflow-x:auto;padding-bottom:0.5rem;margin-bottom:1rem">
      <button class="btn btn-sm btn-secondary chip-cat active" data-cat="global" type="button">Todas</button>
      <button class="btn btn-sm btn-secondary chip-cat" data-cat="peliculas" type="button">🎬 Películas</button>
      <button class="btn btn-sm btn-secondary chip-cat" data-cat="musica" type="button">🎵 Música</button>
      <button class="btn btn-sm btn-secondary chip-cat" data-cat="deportes" type="button">⚽ Deportes</button>
    </div>

    <!-- Tarjeta "Mi Posición" -->
    <div id="me" style="margin-bottom:1.25rem"></div>

    <!-- Lista de Clasificación -->
    <div class="card" style="padding:0">
      <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <h2 id="rank-title" style="font-size:1.15rem">Top 10 de Hoy</h2>
        <span style="font-size:0.8rem;color:var(--text-light)" id="rank-subtitle">Actualizado en vivo</span>
      </div>

      <div id="rank-list" aria-live="polite">
        <div style="text-align:center;padding:2rem;color:var(--text-muted)">Cargando posiciones...</div>
      </div>
    </div>

    <!-- Banner Inferior No Invasivo -->
    <div class="bottom-ad-bar">
      <span>Espacio publicitario no intrusivo</span>
      <span class="bottom-ad-tag">Anuncio</span>
    </div>

  </main>

  <!-- Banner Lateral Derecho (Desktop) -->
  <aside class="side-ad-column" aria-label="Espacio publicitario">
    <div class="ad-banner-box">
      <span class="ad-icon">📢</span>
      <strong>Publicidad</strong>
      <span>Espacio reservado</span>
    </div>
  </aside>

</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/ranking.js}"></script>
</body>
</html>
