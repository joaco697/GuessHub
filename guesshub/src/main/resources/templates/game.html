<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessHub — Jugar</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<div id="toast-container"></div>

<!-- ── MODAL LOGIN ──────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-login">
  <div class="modal">
    <div style="font-size:2rem;margin-bottom:.5rem">🔐</div>
    <div style="font-size:1.2rem;font-weight:900;margin-bottom:1rem">Iniciar sesión</div>
    <div style="display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem">
      <input class="answer-input" id="login-username" type="email" placeholder="Email" autocomplete="off"/>
      <input class="answer-input" id="login-password" type="password" placeholder="Contraseña"/>
    </div>
    <button class="btn-green" id="btn-login-submit">Ingresar</button>
    <div id="login-error" style="color:var(--red);font-size:.82rem;margin-top:.5rem;text-align:center"></div>
  </div>
</div>

<!-- ── MODAL RESULTADO ──────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal-result">
  <div class="modal">
    <div style="font-size:3.5rem;margin-bottom:.5rem" id="modal-icon">🎉</div>
    <div style="font-size:1.3rem;font-weight:900;margin-bottom:.25rem" id="modal-title">¡Correcto!</div>
    <div style="color:var(--text-light);font-size:.9rem;margin-bottom:1.4rem">
      La respuesta era: <strong id="modal-answer"></strong>
    </div>
    <div style="display:flex;flex-direction:column;gap:.6rem">
      <button class="btn-green" id="btn-next">Siguiente →</button>
      <button style="background:none;color:var(--text-light);font-weight:700;font-size:.9rem;padding:.4rem"
        onclick="location.href='/'">Volver al inicio</button>
    </div>
  </div>
</div>

<div class="phone-frame">

  <div class="navbar-game">
    <button class="btn-volver" onclick="location.href='/'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Volver
    </button>
    <div class="game-top-badges">
      <span class="pill pill-green-outline" id="nav-user">–</span>
    </div>
  </div>

  <div class="screen">
    <div class="page-inner">

      <div class="game-card" id="game-card">

        <div class="game-card-header">
          <div class="game-card-title" id="game-mode-title">🎬 ¿Qué es?</div>
          <div style="display:flex;gap:.5rem;align-items:center">
            <span class="pill pill-green" id="timer-badge">🕐 <span id="timer-val">60</span>s</span>
            <span class="pill pill-green" id="game-mode-badge">Cargando...</span>
          </div>
        </div>



        <!-- Pistas reveladas -->
        <div id="clues-container" style="display:flex;flex-direction:column;gap:.5rem"></div>

        <!-- Botón única pista extra (pista 2) -->
        <button class="btn-dashed hidden" id="btn-pista2">💡 Ver pista 2</button>
        <!-- Botón pista 3 -->
        <button class="btn-dashed hidden" id="btn-pista3">💡 Ver pista 3</button>

        <!-- Input respuesta -->
        <input
          class="answer-input"
          id="answer-input"
          type="text"
          placeholder="Escribí tu respuesta…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />

        <button class="btn-green" id="btn-enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Enviar Respuesta
        </button>

      </div>

      <div style="height:.5rem"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="bn-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Jugar
    </button>
    <button class="bn-item" onclick="location.href='/perfil'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      Perfil
    </button>
  </nav>

</div>

<script>
  // ── Estado ────────────────────────────────────────────────────
  let preguntaActual = null;
  let pistasReveladas = 1;
  let modoActual = 'pelicula';
  let timerInterval = null;
  let segundosUsados = 0;
  const TIEMPO_MAX = 60;

  function getToken()    { return localStorage.getItem('token'); }
  function getUsername() { return localStorage.getItem('username'); }

  // ── Al cargar ─────────────────────────────────────────────────
  window.addEventListener('load', () => {
    if (!getToken()) {
      document.getElementById('modal-login').classList.remove('hidden');
    } else {
      document.getElementById('modal-login').classList.add('hidden');
      document.getElementById('nav-user').textContent = '👤 ' + getUsername();
      cargarPregunta();
    }
  });

  // ── Login ─────────────────────────────────────────────────────
  document.getElementById('btn-login-submit').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const errorEl  = document.getElementById('login-error');
    errorEl.textContent = '';
    if (!username || !password) { errorEl.textContent = 'Completá los dos campos'; return; }
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) { errorEl.textContent = 'Usuario o contraseña incorrectos'; return; }
      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', username);
      document.getElementById('modal-login').classList.add('hidden');
      document.getElementById('nav-user').textContent = '👤 ' + username;
      cargarPregunta();
    } catch (e) { errorEl.textContent = 'Error de conexión'; }
  });

  // ── Cargar pregunta (alterna entre pelicula y cancion) ────────
  async function cargarPregunta() {
    // Alternar modo
    modoActual = modoActual === 'pelicula' ? 'cancion' : 'pelicula';

    // Reset UI
    pistasReveladas = 1;
    preguntaActual  = null;
    document.getElementById('clues-container').innerHTML = '';
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-input').className = 'answer-input';
    document.getElementById('answer-input').disabled = false;
    document.getElementById('btn-enviar').disabled = false;
    document.getElementById('btn-pista2').classList.add('hidden');
    document.getElementById('btn-pista3').classList.add('hidden');

    // UI según modo
    if (modoActual === 'pelicula') {
      document.getElementById('game-mode-title').textContent = '🎬 ¿Qué película es?';
      document.getElementById('game-mode-badge').textContent = 'Películas';
      document.getElementById('btn-pista2').textContent = '💡 Ver pista 2: Director';
      document.getElementById('btn-pista3').textContent = '💡 Ver pista 3: Año';
    } else {
      document.getElementById('game-mode-title').textContent = '🎵 ¿Qué canción es?';
      document.getElementById('game-mode-badge').textContent = 'Música';
      document.getElementById('btn-pista2').textContent = '💡 Ver pista 2: Álbum';
      document.getElementById('btn-pista3').textContent = '💡 Ver pista 3: Año';
    }

    try {
      const endpoint = modoActual === 'pelicula' ? '/api/pelicula/random' : '/api/random';
      const res = await fetch(endpoint, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });

      if (res.status === 401) { localStorage.removeItem('token'); location.reload(); return; }
      if (!res.ok) { showToast('Error al cargar la pregunta', 'error'); return; }

      const data = await res.json();

      if (modoActual === 'pelicula') {
        // API devuelve objeto directo
        preguntaActual = {
          id:     data.id,
          tipo:   'pelicula',
          pista1: data.pista1,
          pista2: data.pista2,
          pista3: data.pista3
        };
      } else {
        // API devuelve array
        const cancion = Array.isArray(data) ? data[0] : data;
        preguntaActual = {
          id:     cancion.id || null,
          tipo:   'cancion',
          nombre: cancion.nombre,
          pista1: cancion.pista1,
          pista2: cancion.pista2,
          pista3: cancion.pista3
        };
      }

      // Mostrar pista 1 y habilitar botón pista 2
      agregarPista(preguntaActual.pista1);
      document.getElementById('btn-pista2').classList.remove('hidden');
      iniciarTimer();

    } catch (e) {
      showToast('Error de conexión', 'error');
    }
  }

  // ── Timer ─────────────────────────────────────────────────────
  function iniciarTimer() {
    clearInterval(timerInterval);
    segundosUsados = 0;
    actualizarTimer(TIEMPO_MAX);
    timerInterval = setInterval(() => {
      segundosUsados++;
      const restantes = TIEMPO_MAX - segundosUsados;
      actualizarTimer(restantes);
      if (restantes <= 0) {
        clearInterval(timerInterval);
        // Tiempo agotado — derrota automática
        document.getElementById('answer-input').disabled = true;
        document.getElementById('btn-enviar').disabled = true;
        document.getElementById('btn-pista2').classList.add('hidden');
        document.getElementById('btn-pista3').classList.add('hidden');
        guardarPartida(false);
        setTimeout(() => mostrarResultado(false, preguntaActual
          ? (preguntaActual.tipo === 'pelicula' ? '(tiempo agotado)' : preguntaActual.nombre)
          : '(tiempo agotado)'), 400);
      }
    }, 1000);
  }

  function actualizarTimer(restantes) {
    document.getElementById('timer-val').textContent = restantes;
    const badge = document.getElementById('timer-badge');
    if (restantes <= 10) {
      badge.style.background = 'var(--red)';
    } else if (restantes <= 20) {
      badge.style.background = 'var(--yellow)';
    } else {
      badge.style.background = '';
      badge.className = 'pill pill-green';
    }
  }

  function detenerTimer() {
    clearInterval(timerInterval);
  }

  // ── Guardar partida en backend ────────────────────────────────
  async function guardarPartida(correcto) {
    try {
      await fetch('/api/partida', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({
          correcto,
          pistasUsadas: pistasReveladas,
          segundosUsados
        })
      });
    } catch (e) {
      console.error('Error guardando partida', e);
    }
  }


  document.getElementById('btn-pista2').addEventListener('click', () => {
    agregarPista(preguntaActual.pista2);
    pistasReveladas = 2;
    document.getElementById('btn-pista2').classList.add('hidden');
    document.getElementById('btn-pista3').classList.remove('hidden');
  });

  document.getElementById('btn-pista3').addEventListener('click', () => {
    agregarPista(preguntaActual.pista3);
    pistasReveladas = 3;
    document.getElementById('btn-pista3').classList.add('hidden');
    showToast('No hay más pistas disponibles', '');
  });

  function agregarPista(texto) {
    if (!texto) return;
    const div = document.createElement('div');
    div.className = 'clue-row anim-clue';
    div.innerHTML = `<span class="clue-bulb">💡</span>${texto}`;
    document.getElementById('clues-container').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Enviar respuesta ──────────────────────────────────────────
  document.getElementById('btn-enviar').addEventListener('click', enviarRespuesta);
  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') enviarRespuesta();
  });

  async function enviarRespuesta() {
    const respuesta = document.getElementById('answer-input').value.trim();
    if (!respuesta) { showToast('Escribí una respuesta', ''); return; }
    if (!preguntaActual) return;

    document.getElementById('btn-enviar').disabled = true;
    document.getElementById('answer-input').disabled = true;
    detenerTimer();

    try {
      let resultado;

      if (preguntaActual.tipo === 'pelicula') {
        const res = await fetch('/api/pelicula/respuesta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
          body: JSON.stringify({ peliculaId: preguntaActual.id, respuesta })
        });
        resultado = await res.json();
      } else {
        // Para canciones: validamos localmente por ahora comparando normalizado
        const normalizar = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        const correcto = normalizar(respuesta) === normalizar(preguntaActual.nombre);
        resultado = {
          correcto,
          tituloCorrecto: preguntaActual.nombre
        };
      }

      const input = document.getElementById('answer-input');

      if (resultado.correcto) {
        input.classList.add('state-correct');
        await guardarPartida(true);
        setTimeout(() => mostrarResultado(true, resultado.tituloCorrecto), 400);
      } else {
        input.classList.add('state-wrong');
        const card = document.getElementById('game-card');
        card.classList.remove('anim-shake');
        void card.offsetWidth;
        card.classList.add('anim-shake');
        document.getElementById('btn-pista2').classList.add('hidden');
        document.getElementById('btn-pista3').classList.add('hidden');
        await guardarPartida(false);
        setTimeout(() => mostrarResultado(false, resultado.tituloCorrecto), 800);
      }

    } catch (e) {
      showToast('Error de conexión', 'error');
      document.getElementById('btn-enviar').disabled = false;
      document.getElementById('answer-input').disabled = false;
    }
  }

  // ── Modal resultado ───────────────────────────────────────────
  function mostrarResultado(correcto, tituloCorrecto) {
    document.getElementById('modal-icon').textContent   = correcto ? '🎉' : '😔';
    document.getElementById('modal-title').textContent  = correcto ? '¡Correcto!' : '¡Incorrecto!';
    document.getElementById('modal-answer').textContent = tituloCorrecto;
    document.getElementById('modal-result').classList.remove('hidden');
  }

  document.getElementById('btn-next').addEventListener('click', () => {
    document.getElementById('modal-result').classList.add('hidden');
    cargarPregunta();
  });

  // ── Toast ─────────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 260); }, 2600);
  }
</script>

</body>
</html>
