<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessHub — Jugar</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<div id="toast-container"></div>

<!-- ── MODAL LOGIN ──────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-login">
  <div class="modal">
    <div style="font-size:2rem;margin-bottom:.5rem">🔐</div>
    <div style="font-size:1.2rem;font-weight:900;margin-bottom:1rem">Iniciar sesión</div>
    <div style="display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem">
      <input
        class="answer-input"
        id="login-username"
        type="email"
        placeholder="Email"
        autocomplete="off"
      />
      <input
        class="answer-input"
        id="login-password"
        type="password"
        placeholder="Contraseña"
      />
    </div>
    <button class="btn-green" id="btn-login-submit">Ingresar</button>
    <div id="login-error" style="color:var(--red);font-size:.82rem;margin-top:.5rem;text-align:center"></div>
  </div>
</div>

<!-- ── MODAL RESULTADO ──────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal-result">
  <div class="modal">
    <div style="font-size:3.5rem;margin-bottom:.5rem" id="modal-icon">🎉</div>
    <div style="font-size:1.3rem;font-weight:900;margin-bottom:.25rem" id="modal-title">¡Correcto!</div>
    <div style="color:var(--text-light);font-size:.9rem;margin-bottom:1.4rem">
      La respuesta era: <strong id="modal-answer"></strong>
    </div>
    <div style="display:flex;flex-direction:column;gap:.6rem">
      <button class="btn-green" id="btn-next">Siguiente película →</button>
      <button
        style="background:none;color:var(--text-light);font-weight:700;font-size:.9rem;padding:.4rem"
        onclick="location.href='/'"
      >Volver al inicio</button>
    </div>
  </div>
</div>

<div class="phone-frame">

  <!-- ── NAVBAR GAME ────────────────────────────────────────── -->
  <div class="navbar-game">
    <button class="btn-volver" onclick="location.href='/'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Volver
    </button>
    <div class="game-top-badges">
      <span class="pill pill-green-outline" id="nav-user">–</span>
    </div>
  </div>

  <!-- ── SCREEN ─────────────────────────────────────────────── -->
  <div class="screen">
    <div class="page-inner">

      <div class="game-card" id="game-card">

        <div class="game-card-header">
          <div class="game-card-title">🎬 ¿Qué película es?</div>
          <span class="pill pill-green">Películas</span>
        </div>

        <!-- Poster -->
        <div class="img-placeholder" id="img-area">
          <span class="img-icon">🎬</span>
          <span id="img-label">Cargando...</span>
        </div>

        <!-- Pistas reveladas -->
        <div id="clues-container" style="display:flex;flex-direction:column;gap:.5rem"></div>

        <!-- Botones pistas -->
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <button class="btn-dashed hidden" id="btn-pista2">💡 Ver pista 2: Director</button>
          <button class="btn-dashed hidden" id="btn-pista3">💡 Ver pista 3: Año</button>
        </div>

        <!-- Input respuesta -->
        <input
          class="answer-input"
          id="answer-input"
          type="text"
          placeholder="Escribí el nombre de la película…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />

        <button class="btn-green" id="btn-enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Enviar Respuesta
        </button>

      </div>

      <div style="height:.5rem"></div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ──────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="bn-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Jugar
    </button>
    <button class="bn-item" onclick="location.href='/perfil'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      Perfil
    </button>
  </nav>

</div>

<script>
  let peliculaActual = null;

  function getToken()    { return localStorage.getItem('token'); }
  function getUsername() { return localStorage.getItem('username'); }

  // ── Al cargar la página ───────────────────────────────────────
  window.addEventListener('load', () => {
    if (!getToken()) {
      document.getElementById('modal-login').classList.remove('hidden');
    } else {
      document.getElementById('modal-login').classList.add('hidden');
      document.getElementById('nav-user').textContent = '👤 ' + getUsername();
      cargarPelicula();
    }
  });

  // ── Login ─────────────────────────────────────────────────────
  document.getElementById('btn-login-submit').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const errorEl  = document.getElementById('login-error');
    errorEl.textContent = '';

    if (!username || !password) {
      errorEl.textContent = 'Completá los dos campos';
      return;
    }

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        errorEl.textContent = 'Usuario o contraseña incorrectos';
        return;
      }

      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', username);
      document.getElementById('modal-login').classList.add('hidden');
      document.getElementById('nav-user').textContent = '👤 ' + username;
      cargarPelicula();

    } catch (e) {
      errorEl.textContent = 'Error de conexión';
    }
  });

  // ── Cargar película ───────────────────────────────────────────
  async function cargarPelicula() {
    peliculaActual = null;
    document.getElementById('clues-container').innerHTML = '';
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-input').className = 'answer-input';
    document.getElementById('answer-input').disabled = false;
    document.getElementById('btn-enviar').disabled = false;
    document.getElementById('btn-pista2').classList.add('hidden');
    document.getElementById('btn-pista3').classList.add('hidden');
    document.getElementById('img-area').innerHTML = `<span class="img-icon">🎬</span><span>Cargando...</span>`;

    try {
      const res = await fetch('/api/pelicula/random', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });

      if (res.status === 401) {
        localStorage.removeItem('token');
        location.reload();
        return;
      }

      if (!res.ok) {
        showToast('Error al cargar la película', 'error');
        return;
      }

      peliculaActual = await res.json();

      // Poster
      const imgArea = document.getElementById('img-area');
      if (peliculaActual.poster && peliculaActual.poster !== 'N/A' && peliculaActual.poster !== '') {
        imgArea.innerHTML = `<img src="${peliculaActual.poster}" alt="poster" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius)" />`;
      } else {
        imgArea.innerHTML = `<span class="img-icon">🎬</span><span>Sin imagen disponible</span>`;
      }

      // Pista 1 siempre visible
      agregarPista(peliculaActual.pista1);

      // Mostrar botón pista 2
      document.getElementById('btn-pista2').classList.remove('hidden');

    } catch (e) {
      showToast('Error de conexión', 'error');
    }
  }

  // ── Pistas progresivas ────────────────────────────────────────
  document.getElementById('btn-pista2').addEventListener('click', () => {
    agregarPista(peliculaActual.pista2);
    document.getElementById('btn-pista2').classList.add('hidden');
    document.getElementById('btn-pista3').classList.remove('hidden');
  });

  document.getElementById('btn-pista3').addEventListener('click', () => {
    agregarPista(peliculaActual.pista3);
    document.getElementById('btn-pista3').classList.add('hidden');
  });

  function agregarPista(texto) {
    const div = document.createElement('div');
    div.className = 'clue-row anim-clue';
    div.innerHTML = `<span class="clue-bulb">💡</span>${texto}`;
    document.getElementById('clues-container').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Enviar respuesta ──────────────────────────────────────────
  document.getElementById('btn-enviar').addEventListener('click', enviarRespuesta);
  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') enviarRespuesta();
  });

  async function enviarRespuesta() {
    const respuesta = document.getElementById('answer-input').value.trim();
    if (!respuesta) { showToast('Escribí una respuesta', ''); return; }
    if (!peliculaActual) return;

    document.getElementById('btn-enviar').disabled = true;
    document.getElementById('answer-input').disabled = true;

    try {
      const res = await fetch('/api/pelicula/respuesta', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({ peliculaId: peliculaActual.id, respuesta })
      });

      if (!res.ok) {
        showToast('Error al validar', 'error');
        document.getElementById('btn-enviar').disabled = false;
        document.getElementById('answer-input').disabled = false;
        return;
      }

      const resultado = await res.json();
      const input = document.getElementById('answer-input');

      if (resultado.correcto) {
        input.classList.add('state-correct');
        setTimeout(() => mostrarResultado(resultado), 400);
      } else {
        input.classList.add('state-wrong');
        const card = document.getElementById('game-card');
        card.classList.remove('anim-shake');
        void card.offsetWidth;
        card.classList.add('anim-shake');
        showToast('Incorrecto, intentá de nuevo', 'error');
        setTimeout(() => {
          input.classList.remove('state-wrong');
          input.disabled = false;
          document.getElementById('btn-enviar').disabled = false;
          input.value = '';
          input.focus();
        }, 800);
      }

    } catch (e) {
      showToast('Error de conexión', 'error');
      document.getElementById('btn-enviar').disabled = false;
      document.getElementById('answer-input').disabled = false;
    }
  }

  // ── Modal resultado ───────────────────────────────────────────
  function mostrarResultado(resultado) {
    document.getElementById('modal-answer').textContent = resultado.tituloCorrecto;
    document.getElementById('modal-result').classList.remove('hidden');
  }

  document.getElementById('btn-next').addEventListener('click', () => {
    document.getElementById('modal-result').classList.add('hidden');
    cargarPelicula();
  });

  // ── Toast ─────────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 260); }, 2600);
  }
</script>

</body>
</html>
