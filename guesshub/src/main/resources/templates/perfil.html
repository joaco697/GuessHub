<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessHub — Perfil</title>
  <link rel="stylesheet" href="../static/css/styles.css" />
</head>
<body>

<div id="toast-container"></div>

<div class="phone-frame">

  <!-- ── NAVBAR ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="nav-logo">
      <span>🏆</span>
      Guess<span class="logo-green">Hub</span>
    </div>
    <div class="nav-right">
      <button class="btn-ingresar" id="btn-ingresar">Ingresar</button>
      <button class="avatar-btn">👤</button>
    </div>
  </nav>

  <!-- ── SCREEN ─────────────────────────────────────────────── -->
  <div class="screen">
    <div class="page-inner">

      <!-- Avatar + nombre + badges -->
      <div class="card" style="text-align:center;padding:1.5rem 1.25rem">
        <div
          id="profile-avatar"
          style="width:72px;height:72px;background:var(--green);border-radius:50%;
                 display:flex;align-items:center;justify-content:center;
                 font-size:2.2rem;margin:0 auto .75rem;
                 border:3px solid var(--green-light);"
        >👤</div>
        <!-- Nombre: renderizar con renderProfile() -->
        <div id="profile-name" style="font-weight:900;font-size:1.25rem">–</div>
        <div id="profile-handle" style="color:var(--text-light);font-size:.85rem;margin:.2rem 0 .75rem">–</div>
        <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap" id="profile-badges">
          <!-- renderizado por renderProfile() -->
        </div>
      </div>

      <!-- Stats -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem" id="stats-grid">
        <!-- renderizado por renderStats() -->
      </div>

      <!-- Categorías favoritas -->
      <div class="card">
        <div style="font-weight:900;font-size:1rem;margin-bottom:1rem">Categorías favoritas</div>
        <div style="display:flex;flex-direction:column;gap:.85rem" id="fav-categories">
          <!-- renderizado por renderFavCategories() -->
        </div>
      </div>

      <!-- Actividad semanal -->
      <div class="card">
        <div style="font-weight:900;font-size:1rem;margin-bottom:1rem">Actividad semanal</div>
        <div class="activity-chart" id="activity-chart">
          <!-- renderizado por renderActivity() -->
        </div>
        <div class="activity-labels" id="activity-labels">
          <!-- renderizado por renderActivity() -->
        </div>
      </div>

      <!-- Logros -->
      <div class="section-title"><span>🏅</span> Logros</div>
      <div class="achievements-scroll" id="logros-perfil">
        <!-- renderizado por renderLogros() -->
      </div>

      <!-- Historial -->
      <div class="card">
        <div style="font-weight:900;font-size:1rem;margin-bottom:.9rem">Historial reciente</div>
        <div style="display:flex;flex-direction:column;gap:.5rem" id="history-list">
          <!-- renderizado por renderHistory() -->
        </div>
      </div>

      <!-- Configuración -->
      <div class="card">
        <div style="font-weight:900;font-size:1rem;margin-bottom:1rem">Configuración</div>
        <div style="display:flex;flex-direction:column;gap:.9rem" id="settings-list">
          <!-- renderizado por renderSettings() -->
        </div>
      </div>

      <div style="height:.5rem"></div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ──────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="bn-item" onclick="location.href='ranking.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 20h2V8H7v12zm2-18H7v2h2V2zm4 18h2V4h-2v16zm6 0h2v-8h-2v8zm0-10h2V8h-2v2z"/></svg>
      Ranking
    </button>
    <button class="bn-item" onclick="location.href='game.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Jugar
    </button>
    <button class="bn-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      Perfil
    </button>
  </nav>

</div><!-- /phone-frame -->

<script>
/* =============================================================
   perfil.js — SOLO ANIMACIONES Y RENDER
   ============================================================= */

// ── renderProfile(user) ───────────────────────────────────────
// GET /api/profile/me → user: { name, username, joinDate, streakDays, rankPosition }
function renderProfile(user) {
  document.getElementById('profile-name').textContent    = user.name;
  document.getElementById('profile-handle').textContent  = `@${user.username} · desde ${user.joinDate}`;

  const badges = document.getElementById('profile-badges');
  badges.innerHTML = '';
  const badgeData = [
    { text: '🎮 Activo',              cls: 'pill pill-green-outline' },
    { text: `🔥 Racha x${user.streakDays}`, cls: 'pill pill-orange' },
    { text: `🌍 Ranking #${user.rankPosition}`, cls: 'pill pill-green-outline' },
  ];
  badgeData.forEach(b => {
    const span = document.createElement('span');
    span.className = b.cls;
    span.style.fontSize = '.8rem';
    span.textContent = b.text;
    badges.appendChild(span);
  });
}

// ── renderStats(stats) ───────────────────────────────────────
// stats: { totalScore, gamesPlayed, accuracy, rankPosition }
function renderStats(stats) {
  const items = [
    { val: Number(stats.totalScore).toLocaleString(), lbl: 'Puntos'   },
    { val: stats.gamesPlayed,                          lbl: 'Partidas' },
    { val: stats.accuracy + '%',                       lbl: 'Precisión'},
    { val: '#' + stats.rankPosition,                   lbl: 'Ranking'  },
  ];
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  items.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat-mini anim-pop';
    div.innerHTML = `<div class="val">${s.val}</div><div class="lbl">${s.lbl}</div>`;
    grid.appendChild(div);
  });
}

// ── renderFavCategories(categories) ──────────────────────────
// categories: [{ icon, name, percentage }]
function renderFavCategories(categories) {
  const container = document.getElementById('fav-categories');
  container.innerHTML = '';
  categories.forEach(c => {
    const div = document.createElement('div');
    div.className = 'cat-progress-row';
    div.innerHTML = `
      <div class="cat-progress-header">
        <span>${c.icon} ${c.name}</span>
        <span>${c.percentage}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${c.percentage}%"></div>
      </div>
    `;
    container.appendChild(div);
  });
}

// ── renderActivity(weekData) ──────────────────────────────────
// weekData: [{ day, value, isToday }]  (7 elementos, L-D)
function renderActivity(weekData) {
  const maxVal   = Math.max(...weekData.map(d => d.value), 1);
  const chartEl  = document.getElementById('activity-chart');
  const labelsEl = document.getElementById('activity-labels');
  chartEl.innerHTML  = '';
  labelsEl.innerHTML = '';
  weekData.forEach(d => {
    const bar = document.createElement('div');
    bar.className = 'activity-bar' + (d.isToday ? ' today' : '');
    bar.style.height = Math.round((d.value / maxVal) * 100) + '%';
    chartEl.appendChild(bar);
    const lbl = document.createElement('div');
    lbl.className = 'activity-label';
    lbl.textContent = d.day;
    labelsEl.appendChild(lbl);
  });
}

// ── renderLogros(achievements) ────────────────────────────────
// achievements: [{ icon, name, unlocked }]
function renderLogros(achievements) {
  const container = document.getElementById('logros-perfil');
  container.innerHTML = '';
  achievements.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'ach-item anim-fade-up' + (a.unlocked ? '' : ' locked');
    div.style.animationDelay = `${i * 0.05}s`;
    div.innerHTML = `<div class="ach-icon">${a.icon}</div><div class="ach-name">${a.name}</div>`;
    container.appendChild(div);
  });
}

// ── renderHistory(matches) ────────────────────────────────────
// matches: [{ icon, title, date, points, won }]
function renderHistory(matches) {
  const container = document.getElementById('history-list');
  container.innerHTML = '';
  matches.forEach(m => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <span class="hi-icon">${m.icon}</span>
      <div style="flex:1">
        <div class="hi-title">${m.title}</div>
        <div class="hi-meta">${m.date}</div>
      </div>
      <div class="hi-pts ${m.won ? 'win' : 'loss'}">
        ${m.won ? '+' : ''}${Number(m.points).toLocaleString()}
      </div>
    `;
    container.appendChild(div);
  });
}

// ── renderSettings(settings) ─────────────────────────────────
// settings: [{ key, label, description, enabled }]
// El cambio se envía con PUT /api/profile/me/settings
function renderSettings(settings) {
  const container = document.getElementById('settings-list');
  container.innerHTML = '';
  settings.forEach((s, idx) => {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:.5rem';
    div.innerHTML = `
      <div>
        <div style="font-weight:800;font-size:.92rem">${s.label}</div>
        <div style="font-size:.76rem;color:var(--text-light);font-weight:600">${s.description}</div>
      </div>
      <label class="toggle">
        <input type="checkbox" ${s.enabled ? 'checked' : ''} data-key="${s.key}" onchange="onToggle(this)">
        <span class="toggle-slider"></span>
      </label>
    `;
    container.appendChild(div);
    // Separador entre items
    if (idx < settings.length - 1) {
      const hr = document.createElement('div');
      hr.style.cssText = 'height:1px;background:var(--border)';
      container.appendChild(hr);
    }
  });
}

// ── onToggle: envía el cambio a la API ────────────────────────
function onToggle(checkbox) {
  const key     = checkbox.dataset.key;
  const enabled = checkbox.checked;
  // TODO: PUT /api/profile/me/settings con body { key, enabled }
  // showToast con el resultado
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 260);
  }, 2600);
}

</script>

</body>
</html>
