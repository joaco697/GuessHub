<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessHub — Ranking</title>
  <link rel="stylesheet" href="../static/css/styles.css" />
</head>
<body>

<div class="bg-mesh"></div>
<div id="toast-container"></div>

<div class="page">
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-logo font-display"><a href="index.html">Guess<span>Hub</span></a></div>
    <div class="navbar-links">
      <a href="index.html">Inicio</a>
      <a href="game.html">Jugar</a>
      <a href="leaderboard.html" class="active">Ranking</a>
      <a href="profile.html">Perfil</a>
    </div>
    <div class="navbar-user">
      <span style="font-size:.85rem;color:var(--muted)">Hola, <strong style="color:var(--text)">Alex</strong></span>
      <div class="avatar" onclick="window.location='profile.html'">A</div>
    </div>
  </nav>

  <div class="lb-page-inner">
    <!-- Header -->
    <div style="text-align:center;margin-bottom:1rem">
      <h1 class="font-display" style="font-size:2.2rem;font-weight:800;letter-spacing:-.03em">Ranking Global</h1>
      <p style="color:var(--muted);margin-top:.5rem">Los mejores jugadores de GuessHub esta semana</p>
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:.5rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap" id="filter-tabs">
      <button class="btn btn-primary btn-sm active-tab" data-filter="global" onclick="setFilter('global',this)">🌍 Global</button>
      <button class="btn btn-ghost btn-sm" data-filter="weekly" onclick="setFilter('weekly',this)">📅 Esta semana</button>
      <button class="btn btn-ghost btn-sm" data-filter="cine" onclick="setFilter('cine',this)">🎬 Cine</button>
      <button class="btn btn-ghost btn-sm" data-filter="musica" onclick="setFilter('musica',this)">🎵 Música</button>
      <button class="btn btn-ghost btn-sm" data-filter="deportes" onclick="setFilter('deportes',this)">⚽ Deportes</button>
      <button class="btn btn-ghost btn-sm" data-filter="geo" onclick="setFilter('geo',this)">🌍 Geografía</button>
    </div>

    <!-- Podium -->
    <div class="lb-podium" id="podium">
      <!-- filled by JS -->
    </div>

    <!-- Full list -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h2 class="font-display" style="font-size:1.1rem;font-weight:700">Tabla completa</h2>
      <span style="font-size:.8rem;color:var(--muted)" id="updated-lbl">Actualizado hace 2 min</span>
    </div>
    <div class="lb-full-list" id="lb-list">
      <!-- filled by JS -->
    </div>

    <!-- CTA -->
    <div style="text-align:center;margin-top:2.5rem;padding:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)">
      <p class="font-display" style="font-size:1.15rem;font-weight:700;margin-bottom:.5rem">¿Querés estar en el top?</p>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem">Jugá más rondas y subí tu puntuación global</p>
      <a href="game.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Jugar ahora
      </a>
    </div>
  </div>

  <footer style="border-top:1px solid var(--border);padding:1.5rem 2rem;text-align:center;color:var(--muted);font-size:.82rem;">
    © 2025 GuessHub · Hecho con ♥
  </footer>
</div>

<script>
  // ── Data ─────────────────────────────────────────────────────
  const leaderboardData = {
    global: [
      { name:'StarGuesser',   pts:9840, games:142, country:'🇧🇷', badge:'🏆' },
      { name:'Luna_99',       pts:8210, games:98,  country:'🇦🇷', badge:'🥇' },
      { name:'ProGuesser',    pts:7560, games:115, country:'🇲🇽', badge:'⭐' },
      { name:'CineFreak',     pts:6830, games:87,  country:'🇨🇴', badge:'🎬' },
      { name:'TopFan',        pts:5970, games:76,  country:'🇨🇱', badge:'🎵' },
      { name:'Alex (tú)',     pts:5420, games:64,  country:'🇦🇷', badge:'🎮', me:true },
      { name:'QuizKing',      pts:4890, games:59,  country:'🇵🇪', badge:'👑' },
      { name:'NightOwl',      pts:4230, games:55,  country:'🇺🇾', badge:'🦉' },
      { name:'FastMind',      pts:3780, games:48,  country:'🇻🇪', badge:'⚡' },
      { name:'Trivialize',    pts:3210, games:43,  country:'🇧🇴', badge:'🧠' },
      { name:'GeoWizard',     pts:2870, games:38,  country:'🇪🇨', badge:'🌍' },
      { name:'SportsFreak',   pts:2540, games:34,  country:'🇵🇾', badge:'⚽' },
    ],
    weekly: [
      { name:'Luna_99',       pts:2840, games:22, country:'🇦🇷', badge:'🥇' },
      { name:'FastMind',      pts:2510, games:19, country:'🇻🇪', badge:'⚡' },
      { name:'StarGuesser',   pts:2200, games:17, country:'🇧🇷', badge:'🏆' },
      { name:'Alex (tú)',     pts:1980, games:15, country:'🇦🇷', badge:'🎮', me:true },
      { name:'QuizKing',      pts:1740, games:13, country:'🇵🇪', badge:'👑' },
      { name:'CineFreak',     pts:1530, games:11, country:'🇨🇴', badge:'🎬' },
    ],
    cine: [
      { name:'CineFreak',     pts:4820, games:61, country:'🇨🇴', badge:'🎬' },
      { name:'TopFan',        pts:3910, games:52, country:'🇨🇱', badge:'🎬' },
      { name:'StarGuesser',   pts:3200, games:44, country:'🇧🇷', badge:'🏆' },
      { name:'Alex (tú)',     pts:2780, games:38, country:'🇦🇷', badge:'🎮', me:true },
    ],
    musica: [
      { name:'TopFan',        pts:5120, games:74, country:'🇨🇱', badge:'🎵' },
      { name:'Luna_99',       pts:4300, games:62, country:'🇦🇷', badge:'🎵' },
      { name:'NightOwl',      pts:3650, games:50, country:'🇺🇾', badge:'🦉' },
      { name:'Alex (tú)',     pts:2100, games:30, country:'🇦🇷', badge:'🎮', me:true },
    ],
    deportes: [
      { name:'ProGuesser',    pts:4980, games:72, country:'🇲🇽', badge:'⚽' },
      { name:'SportsFreak',   pts:4310, games:65, country:'🇵🇾', badge:'⚽' },
      { name:'StarGuesser',   pts:3700, games:55, country:'🇧🇷', badge:'🏆' },
      { name:'Alex (tú)',     pts:1900, games:28, country:'🇦🇷', badge:'🎮', me:true },
    ],
    geo: [
      { name:'GeoWizard',     pts:6100, games:92, country:'🇪🇨', badge:'🌍' },
      { name:'Trivialize',    pts:4800, games:73, country:'🇧🇴', badge:'🧠' },
      { name:'QuizKing',      pts:3900, games:60, country:'🇵🇪', badge:'👑' },
      { name:'Alex (tú)',     pts:2400, games:35, country:'🇦🇷', badge:'🎮', me:true },
    ],
  };

  let activeFilter = 'global';

  function setFilter(filter, el) {
    activeFilter = filter;
    document.querySelectorAll('#filter-tabs button').forEach(b => {
      b.className = 'btn btn-ghost btn-sm';
    });
    el.className = 'btn btn-primary btn-sm active-tab';
    renderLeaderboard(filter);
  }

  function renderLeaderboard(filter) {
    const data = leaderboardData[filter] || leaderboardData.global;

    // Podium (top 3)
    const podium = document.getElementById('podium');
    const top3 = data.slice(0, 3);
    // order: 2nd, 1st, 3rd
    const order = [top3[1], top3[0], top3[2]].filter(Boolean);
    const placeClass = ['place-2', 'place-1', 'place-3'];
    const heights = [90, 120, 70];
    const sizes = [52, 64, 52];
    const realRanks = [2, 1, 3];
    const medals = ['🥈', '🥇', '🥉'];

    podium.innerHTML = '';
    order.forEach((p, i) => {
      if (!p) return;
      const div = document.createElement('div');
      div.className = `podium-place ${placeClass[i]}`;
      const initials = p.name.slice(0,2).toUpperCase();
      div.innerHTML = `
        <div class="podium-avatar" style="width:${sizes[i]}px;height:${sizes[i]}px;font-size:${sizes[i]*0.3}px">${initials}</div>
        <div class="podium-name">${p.name}</div>
        <div class="podium-pts font-display">${p.pts.toLocaleString()}</div>
        <div class="podium-block" style="height:${heights[i]}px">${medals[i]}</div>
      `;
      podium.appendChild(div);
    });

    // Full list
    const list = document.getElementById('lb-list');
    list.innerHTML = '';
    data.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'lb-full-item' + (p.me ? ' me' : '');
      div.style.animationDelay = `${i * 0.04}s`;
      div.classList.add('anim-pop');

      let rankDisplay = i + 1;
      let rankStyle = 'color:var(--muted)';
      if (i === 0) rankStyle = 'color:var(--warning)';
      else if (i === 1) rankStyle = 'color:#aaa';
      else if (i === 2) rankStyle = 'color:#cd7f32';

      div.innerHTML = `
        <div class="lb-num font-display" style="${rankStyle}">${rankDisplay}</div>
        <div class="avatar" style="width:34px;height:34px;font-size:.8rem;border-radius:50%;flex-shrink:0">${p.name.slice(0,2).toUpperCase()}</div>
        <div style="flex:1">
          <div class="lb-full-name${p.me ? ' text-accent' : ''}" style="${p.me ? 'color:var(--accent)' : ''}">${p.name} ${p.badge || ''}</div>
          <div style="font-size:.75rem;color:var(--muted)">${p.country} · ${p.games} partidas</div>
        </div>
        <div class="lb-full-score font-display">${p.pts.toLocaleString()}</div>
      `;
      list.appendChild(div);
    });
  }

  function showToast(msg, type = 'info') {
    const icons = { success: '✓', error: '✕', info: 'ℹ' };
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${icons[type]}</span>${msg}`;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => { t.classList.add('toast-exit'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  renderLeaderboard('global');
</script>
</body>
</html>
